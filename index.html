<!--
File 1: library.json (place at project root)
This manifest describes your AllMusic folder structure.
When you add/remove albums or tracks, update this file accordingly.
-->
{
    "folders": [
      {
        "name": "Elements",
        "files": ["01_Hydrogen.mp3", "02_Helium.mp3", "03_Lithium.mp3"]
      },
      {
        "name": "Album2",
        "files": ["anothertrack.mp3"]
      }
    ]
  }
  
  <!--
  File 2: index.html (in your GitHub Pages root)
  This fetches library.json, populates dropdowns, and streams files from /AllMusic/...
  -->
  <!DOCTYPE html>
  <html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Music Player</title>
    <style>
      body { font-family: sans-serif; max-width:600px; margin:2rem auto; }
      select, button { margin:0.5rem 0; padding:0.5rem; }
      textarea { width:100%; height:200px; margin-top:1rem; }
      audio { width:100%; margin-top:1rem; display:block; }
    </style>
  </head>
  <body>
    <h1>Music Player</h1>
  
    <select id="albumSelect">
      <option value="">Select album…</option>
    </select>
    <br />
    <select id="trackSelect" disabled>
      <option value="">Select track…</option>
    </select>
    <br />
    <button id="playBtn" style="display:none;">Play</button>
  
    <audio id="player" controls style="display:none;"></audio>
    <textarea id="info" readonly placeholder="Track info…"></textarea>
  
    <script>
      let library;
      const albumSelect = document.getElementById('albumSelect');
      const trackSelect = document.getElementById('trackSelect');
      const playBtn     = document.getElementById('playBtn');
      const player      = document.getElementById('player');
      const infoBox     = document.getElementById('info');
  
      // 1) load manifest
      fetch('library.json')
        .then(res=>res.json())
        .then(json=>{
          library = json.folders;
          library.forEach(f=> albumSelect.add(new Option(f.name, f.name)));
        })
        .catch(err=> console.error('Could not load library.json', err));
  
      // 2) when album chosen
      albumSelect.addEventListener('change', ()=>{
        trackSelect.innerHTML = '<option value="">Select track…</option>';
        trackSelect.disabled = true;
        playBtn.style.display = 'none';
        player.style.display  = 'none';
        infoBox.value = '';
  
        const sel = library.find(a=>a.name===albumSelect.value);
        if (!sel) return;
        sel.files.forEach(f=> trackSelect.add(new Option(f, f)));
        trackSelect.disabled = false;
      });
  
      // 3) when track chosen
      trackSelect.addEventListener('change', ()=>{
        playBtn.style.display = trackSelect.value ? 'inline-block' : 'none';
        player.style.display  = 'none';
        infoBox.value = '';
      });
  
      // 4) play & load text
      playBtn.addEventListener('click', ()=>{
        const album = albumSelect.value;
        const file  = trackSelect.value;
        if (!album||!file) return;
  
        // audio
        player.src = `AllMusic/${album}/${file}`;
        player.style.display = 'block';
        player.play();
  
        // text
        const txtPath = `AllMusic/${album}/${file.replace(/\.mp3$/i,'.txt')}`;
        fetch(txtPath)
          .then(r=>r.text())
          .then(text=> infoBox.value = text)
          .catch(_=> infoBox.value = 'No .txt found.');
      });
    </script>
  </body>
  </html>
